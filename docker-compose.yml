x-airflow-common: &airflow-common
  build:
    context: ./airflow
    dockerfile: Dockerfile
  env_file:
    - .env
    - path: ./airflow/.env.example
      required: true
    - path: ./airflow/.env
      required: false
  user: "0:0"
  environment:
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-postgres:5432/airflow
    POSTGRES_HOST: postgres
    PYTHONPATH: /opt/airflow/project
    SELENIUM_HEADLESS: "true"
  volumes:
    - ./:/opt/airflow/project
    - ./airflow/dags:/opt/airflow/dags
    - airflow_logs:/opt/airflow/logs
  depends_on:
    airflow-postgres:
      condition: service_healthy
    postgres:
      condition: service_healthy

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: job_market_api
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - ./src:/app/src:ro
      - ./models:/app/models:ro
    command: uvicorn src.api.main:app --host 0.0.0.0 --port 8000 --reload

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: job_market_dashboard
    env_file:
      - .env
    environment:
      JOB_MARKET_API_URL: http://api:8000
    depends_on:
      - api
    ports:
      - "${DASHBOARD_PORT:-8501}:8501"
    volumes:
      - ./src:/app/src:ro
    command: streamlit run src/dashboard/streamlit_app.py --server.address=0.0.0.0 --server.port=8501

  postgres:
    image: postgres:16
    container_name: job_market_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-job_market}
      POSTGRES_USER: ${POSTGRES_USER:-job_market}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-job_market}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-job_market} -d ${POSTGRES_DB:-job_market}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4:9
    container_name: job_market_pgadmin
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-marbdejobmarketa@gmail.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin}
      PGADMIN_CONFIG_ENHANCED_COOKIE_PROTECTION: "False"
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin

  airflow-postgres:
    image: postgres:16
    container_name: job_market_airflow_postgres
    environment:
      POSTGRES_DB: airflow
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - airflow_postgres_data:/var/lib/postgresql/data

  airflow-init:
    <<: *airflow-common
    container_name: job_market_airflow_init
    command: >
      bash -c "
      airflow db migrate &&
      (
      airflow users create
      --username $${AIRFLOW_ADMIN_USERNAME:-admin}
      --password $${AIRFLOW_ADMIN_PASSWORD:-admin}
      --firstname Job
      --lastname Market
      --role Admin
      --email $${AIRFLOW_ADMIN_EMAIL:-marbdejobmarketa@gmail.com}
      || true
      )
      "

  airflow-webserver:
    <<: *airflow-common
    container_name: job_market_airflow_webserver
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    ports:
      - "8080:8080"
    command: webserver

  airflow-scheduler:
    <<: *airflow-common
    container_name: job_market_airflow_scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    command: scheduler

volumes:
  postgres_data:
  pgadmin_data:
  airflow_postgres_data:
  airflow_logs:
