job_market_dbt:
  target: "{{ env_var('DBT_TARGET', 'dev') }}"
  outputs:
    dev:
      type: postgres
      host: "{{ env_var('POSTGRES_HOST', 'localhost') }}"
      port: "{{ env_var('POSTGRES_PORT', '5432') | int }}"
      user: "{{ env_var('POSTGRES_USER', 'job_market') }}"
      password: "{{ env_var('POSTGRES_PASSWORD', 'job_market') }}"
      dbname: "{{ env_var('POSTGRES_DB', 'job_market') }}"
      schema: "{{ env_var('DBT_DEV_SCHEMA', 'analytics') }}"
      threads: "{{ env_var('DBT_DEV_THREADS', '4') | int }}"
    prod:
      type: postgres
      host: "{{ env_var('SUPABASE_DB_HOST', 'db.example.supabase.co') }}"
      port: "{{ env_var('SUPABASE_DB_PORT', '5432') | int }}"
      user: "{{ env_var('SUPABASE_DB_USER', 'postgres') }}"
      password: "{{ env_var('SUPABASE_DB_PASSWORD', '') }}"
      dbname: "{{ env_var('SUPABASE_DB_NAME', 'postgres') }}"
      schema: "{{ env_var('SUPABASE_DB_SCHEMA', 'analytics') }}"
      sslmode: require
      threads: "{{ env_var('DBT_PROD_THREADS', '4') | int }}"
